name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pti
          POSTGRES_PASSWORD: pti
          POSTGRES_DB: pti_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pti" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pti:pti@localhost:5432/pti_test
      DATABASE_URL: postgres://pti:pti@localhost:5432/pti_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision database roles
        run: |
          psql "$TEST_DATABASE_URL" -c "CREATE ROLE pti_app LOGIN NOBYPASSRLS PASSWORD 'pti_app'"
          psql "$TEST_DATABASE_URL" -c "CREATE ROLE pti_system LOGIN BYPASSRLS PASSWORD 'pti_system'"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
