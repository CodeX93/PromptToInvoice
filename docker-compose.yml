# Local development stack. `docker compose up -d` then `pnpm db:migrate`.
name: prompttoinvoice

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pti
      POSTGRES_PASSWORD: pti
      POSTGRES_DB: pti
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pti"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pti
      MINIO_ROOT_PASSWORD: pti-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 pti pti-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/pti-files; exit 0"

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]

  stripe-cli:
    image: stripe/stripe-cli:v1.27.0
    profiles: [stripe]
    command: listen --forward-to http://host.docker.internal:3000/api/webhooks/stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  pgdata:
  minio:
